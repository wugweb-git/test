name: WordPress coding standards

# Security sniffs (escaping, nonces, sanitising, prepared SQL) are reported on every
# push and weekly. Formatting sniffs are not enforced: the theme uses a compact style.
on:
  push:
    branches: [main]
    paths: ['wugweb-kits/**', 'phpcs.xml.dist', '.github/workflows/phpcs.yml']
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: Install PHPCS and WPCS
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction squizlabs/php_codesniffer wp-coding-standards/wpcs dealerdirect/phpcodesniffer-composer-installer
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"
      - name: Security sniffs (report only for now)
        continue-on-error: true
        run: |
          phpcs --standard=phpcs.xml.dist -n --report=full \
            --sniffs=WordPress.Security.EscapeOutput,WordPress.Security.NonceVerification,WordPress.Security.ValidatedSanitizedInput,WordPress.DB.PreparedSQL,WordPress.DB.DirectDatabaseQuery
